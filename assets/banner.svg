  <text x="70" y="172" font-size="52" font-weight="600" fill="#D9D3C7">herman bakanin</text>
  <text x="72" y="214" font-size="18" fill="#8A8273">builds things that talk back.</text>
  <text x="72" y="256" font-size="15" letter-spacing="2" fill="#4D4940">59 / 60 in formation</text>
</g>
